[package]
name = "codedock"
version = "0.1.0"
description = "CodeDock - AI 编程驾驶舱"
authors = ["硅原子"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "codedock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# build.rs 要读/改 TAURI_CONFIG（给 debug 构建换 identifier），得能解析 JSON
serde_json = "1"

[dependencies]
# tray-icon：系统托盘（关闭窗口后驻留后台的入口）；image-png：托盘图标解码
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# 单实例：已有一个实例在跑时（可能收进了托盘），再启动只唤回它，不新开进程
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri-plugin-opener = "2.5.5"
tauri-plugin-clipboard-manager = "2"
regex = "1.13.1"
notify = "8.2"
# AI 生成提交信息用。自带 rustls 而不是 native-tls：不带 OpenSSL 依赖，
# 三端统一。注意 reqwest 0.13 起该特性叫 `rustls`（不再是 rustls-tls）。
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# 智能体后端读 opencode 的 SSE 时要做退避重连，只需要 time 这一个特性。
# tauri 本来就依赖 tokio，这里只是显式声明版本、打开要用的特性。
tokio = { version = "1", features = ["time"] }
# API 密钥落存储：借操作系统的凭据库。默认特性 v1 = Windows 凭据管理器 /
# macOS 钥匙串 / Linux Secret Service（zbus），三端开箱可用，别关掉。
keyring = "4.2.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
