[package]
name = "codovo"
version = "0.1.0"
description = "Codovo - AI 编程驾驶舱"
authors = ["硅原子"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "codovo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# build.rs 要读/改 TAURI_CONFIG（给 debug 构建换 identifier），得能解析 JSON
serde_json = "1"

[dependencies]
# tray-icon：系统托盘（关闭窗口后驻留后台的入口）；image-png：托盘图标解码；
# protocol-asset：asset 协议，内置浏览器用它加载工作区里的 html（只多一个 http-range 小依赖）
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
# 单实例：已有一个实例在跑时（可能收进了托盘），再启动只唤回它，不新开进程
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# CICD 部署模块读 / 写项目根 .local-cicd.yaml。serde_yaml 虽已归档，但 API 稳定、
# 与 serde 同源、被大量项目沿用；换活跃 fork 会平白多引一套维护面。
serde_yaml = "0.9"
base64 = "0.22"
tauri-plugin-opener = "2.5.5"
tauri-plugin-clipboard-manager = "2"
regex = "1.13.1"
notify = "8.2"
# 内容搜索要跳过 .gitignore 忽略掉的文件：ignore 是 ripgrep 的遍历库，负责
# .gitignore / .ignore / .git/info/exclude 的匹配与目录剪枝。忽略文件的语义很绕
# （`!` 否定、嵌套 .gitignore、只忽略目录的规则、父目录被忽略后子文件救不回来……），
# 自己实现一遍必然对不齐，用被 ripgrep / VS Code 搜索长期验证过的实现。
ignore = "0.4"
# 文本文件按原编码读写（见 `encoding.rs`）：GBK / Big5 / UTF-16 的老工程
# 不能被 UTF-8 覆盖。encoding_rs 是 WHATWG 编码标准的实现，chardetng 是
# Firefox 的编码探测器，两者同作者、依赖同一版 encoding_rs。
encoding_rs = "0.8.42"
chardetng = "1"
# AI 生成提交信息用。自带 rustls 而不是 native-tls：不带 OpenSSL 依赖，
# 三端统一。注意 reqwest 0.13 起该特性叫 `rustls`（不再是 rustls-tls）。
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# 智能体后端读 opencode 的 SSE 时要做退避重连，只需要 time；SSH 还要 net（TcpStream）、
# io-util（AsyncReadExt）、sync（mpsc）、rt / macros（tokio::select!）。
# tauri 本来就依赖 tokio，这里只是显式声明版本、打开要用的特性。
tokio = { version = "1", features = ["time", "net", "io-util", "sync", "rt", "macros", "fs"] }
# 远程连接：SSH 客户端。纯 Rust、无原生依赖，default 特性带 aws-lc-rs
# （reqwest/rustls 已经在用同一后端，不会多引一套 TLS）。
russh = "0.64"
# SFTP 协议实现。3.0 起与 russh 解耦，只吃 AsyncRead + AsyncWrite 流。
russh-sftp = "3.0"
# API 密钥落存储：借操作系统的凭据库。默认特性 v1 = Windows 凭据管理器 /
# macOS 钥匙串 / Linux Secret Service（zbus），三端开箱可用，别关掉。
keyring = "4.2.0"
# 数据库连接：一个 crate 覆盖 MySQL / PostgreSQL / SQLite，异步，和 russh 同风格。
# - 不用默认特性、也不开 `macros`：`query!` 要编译期 DATABASE_URL，一律用运行时 `sqlx::query`。
# - `runtime-tokio` 必须显式给；运行时由 tauri 提供。
# - TLS 走 aws-lc：reqwest/russh 已经在用同一后端，若这里引 ring 会同时装两个
#   CryptoProvider，rustls 0.23 在没显式装默认时会直接 panic。
# - chrono / bigdecimal / uuid / json 是列类型的解码支持，缺了这些列只能显示「无法显示」。
sqlx = { version = "0.8.6", default-features = false, features = [
  "runtime-tokio",
  "mysql",
  "postgres",
  "sqlite",
  "tls-rustls-aws-lc-rs",
  "chrono",
  "bigdecimal",
  "uuid",
  "json",
  "macros",
] }
# sqlx 的列解码要用到这几个类型名，所以得作为直接依赖
chrono = "0.4"
bigdecimal = "0.4"
uuid = { version = "1", features = ["v4"] }
# 查询结果导出为 Excel(.xlsx)。纯 Rust、默认无 C 依赖（不引 zlib 特性），只写不读，
# 比前端 SheetJS 少一次「把整包数据搬到 WebView 再搬回来」的往返。
rust_xlsxwriter = "0.99"
# AI 运行时：Rig。对话式助手与内置生成能力都跑在进程内，不再起 opencode 子进程。
# - 只依赖 rig-core / rig-agent / rig-memory，**不**用 rig 元 crate：它的默认特性会
#   拉 lancedb、fastembed、milvus、vectorize，给桌面应用白装几百 MB 的向量库。
# - 版本锁死：Rig 还在 pre-1.0，小版本之间就有破坏性改动（0.45 刚把 agent 拆成独立
#   crate）。升级要照它的 MIGRATING.md 逐条过。
# - rig-core 的 reqwest 特性带的是自己的传输层（rig-reqwest），rustls 走 aws-lc，
#   和本仓库已有的 reqwest / russh / sqlx 是同一套 TLS 后端。
rig-core = { version = "=0.45.0", default-features = false, features = ["derive", "reqwest", "rustls"] }
rig-agent = "=0.45.0"
rig-memory = { version = "=0.45.0", features = ["fs"] }
futures = "0.3"


# 自绘标题栏的右键要弹系统菜单（GetSystemMenu / TrackPopupMenuEx）。只用得到几个
# user32 函数，用 windows-sys 这套原始绑定就够，不必引完整的 windows crate。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
