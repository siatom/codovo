[package]
name = "codedock"
version = "0.1.0"
description = "CodeDock - AI 编程驾驶舱"
authors = ["硅原子"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "codedock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri-plugin-opener = "2.5.5"
tauri-plugin-clipboard-manager = "2"
regex = "1.13.1"
notify = "8.2"
# AI 生成提交信息用。自带 rustls 而不是 native-tls：不带 OpenSSL 依赖，
# 三端统一。注意 reqwest 0.13 起该特性叫 `rustls`（不再是 rustls-tls）。
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# 智能体后端读 opencode 的 SSE 时要做退避重连，只需要 time 这一个特性。
# tauri 本来就依赖 tokio，这里只是显式声明版本、打开要用的特性。
tokio = { version = "1", features = ["time"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
