<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- CodeDock 应用图标的源文件：改完用 `npx tauri icon src-tauri/icons/icon.svg` 重新生成整套。
       生成后必须 `touch src-tauri/build.rs` 再构建一次，否则 tauri-build 不会重跑，
       exe / 安装包里还是旧图标（它的 rerun-if-changed 没覆盖 icons 目录）。
       深色圆角底 + 蓝色尖括号，配色取自前端 styles.css 的语义色 c-app / c-accent 一系。
       圆角取 228（22.3%），和 macOS 的 squircle 比例一致，Windows/Linux 也自带圆角。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a212b" />
      <stop offset="1" stop-color="#0b0d11" />
    </linearGradient>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9cc6ff" />
      <stop offset="1" stop-color="#4c8dff" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)" />
  <g fill="none" stroke="url(#fg)" stroke-width="88" stroke-linecap="round" stroke-linejoin="round">
    <path d="M347 360 L222 512 L347 664" />
    <path d="M566 350 L458 674" />
    <path d="M677 360 L802 512 L677 664" />
  </g>
</svg>
